# Mod metadata. Dollar-brace placeholders are expanded from gradle.properties by the
# generateModMetadata task (see build.gradle).

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issues_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="原作者 lhy512103 · 移植作者 GeZiAsi"
credits="Forge 1.20.1 / GTL 移植：GeZiAsi（格兹亚西）。AE2WTLib 图标 by mari_023 (MIT)。"
displayURL="${mod_source_url}"
description='''
原作者：lhy512103 — ${mod_original_url}
移植作者：GeZiAsi（格兹亚西） — ${mod_source_url}
游戏版本：Minecraft ${minecraft_version} · Forge ${forge_version_range}

ME 拼接终端：可拖拽、可拼接的 AE2 无线终端。把 ME 列表、合成、样板编码、样板管理、样板缓存、垃圾桶、工具包等模块放进同一个可自由排布的工作区。适配 GTL（GregTech Leisure）整合包：AE2 15、AE2WTLib 15、JEI 15.19+。

A spliceable, drag-and-drop ME terminal that unifies AE2 wireless terminal modules into one customizable workspace. Forge 1.20.1 port for the GTL modpack.
Original author: lhy512103 (${mod_original_url}). Port: GeZiAsi (${mod_source_url}).
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Applied Energistics 2 — required, this mod builds on its terminal/grid system.
[[dependencies.${mod_id}]]
    modId="ae2"
    mandatory=true
    versionRange="[15.2,16)"
    ordering="AFTER"
    side="BOTH"

# AE2 Wireless Terminal Library — required, provides the wireless terminal framework we integrate.
[[dependencies.${mod_id}]]
    modId="ae2wtlib"
    mandatory=true
    versionRange="[15.2,16)"
    ordering="AFTER"
    side="BOTH"

# JEI — optional recipe viewer. When present, the MEST JEI plugin registers a crafting-matrix
# transfer handler so the JEI "+" button fills the MEST crafting grid.
[[dependencies.${mod_id}]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="AFTER"
    side="CLIENT"

# ExtendedAE — optional. Pattern-access rows reuse its highlight and message helpers.
[[dependencies.${mod_id}]]
    modId="expatternprovider"
    mandatory=false
    versionRange="[1.4,)"
    ordering="AFTER"
    side="BOTH"
