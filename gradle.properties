# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Parchment mappings: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

## Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
# Forge version of the GTL (GregTech Leisure) modpack.
forge_version=47.4.16
# Lowest Forge we accept at runtime (FML major version is the loader version).
forge_version_range=[47.1,)
loader_version_range=[47,)

## Mod Properties
mod_id=mesplicedterminal
mod_name=ME Spliced terminal
mod_license=MIT
mod_version=0.0.3.0-forge1.20.1
mod_group_id=com.lhy.mest
# Source of this Forge 1.20.1 port and of the original NeoForge 1.21.1 mod.
mod_source_url=https://github.com/OWNER/MEST/tree/forge-1.20.1
mod_issues_url=https://github.com/OWNER/MEST/issues
mod_original_url=https://github.com/lhy512103/MEST

## Dependency versions, pinned to the GTL modpack (GregTech Leisure, Forge 1.20.1).
ae2_version=15.4.10
ae2wtlib_version=15.3.3-forge
extendedae_version=1.20-1.4.12-forge
glodium_version=1.20-1.5-forge
# Compile against the oldest JEI the GTL packs ship (15.19/15.20) so the plugin loads on all of them.
jei_api_version=15.20.0.106
jei_version=15.49.0.200
curios_version=5.14.1+1.20.1
guideme_version=20.1.14
cloth_config_version=11.1.136
architectury_version=9.2.14
