plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Launchers such as PCL only show the file name for mods not listed on Modrinth/CurseForge, so
// the released jar's name carries the mod name, game version and porter.
tasks.matching { it.name == 'reobfJar' }.configureEach {
    archiveFileName = "ME拼接终端-MEST-${mod_version}-GeZiAsi.jar"
}

// Development-only automation (src/devtest): drives a test world and screenshots the terminal.
// It is never part of the published jar; only the runClientDevtest run enables it.
sourceSets {
    devtest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// Minecraft 1.20.1 ships Java 17 to end users.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        // Hosts AE2 ("appeng") and other modding artifacts.
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
        content {
            includeGroup "me.shedaniel.cloth"
        }
    }
    maven {
        name = "Architectury Maven"
        url = "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name = "Curios Maven"
        url = "https://maven.theillusivec4.top/"
        content {
            includeGroup "top.theillusivec4.curios"
        }
    }
    exclusiveContent {
        // AE2WTLib 15.3.3, ExtendedAE and Glodium builds used by GTL are published on Modrinth.
        forRepository {
            maven {
                name = "Modrinth Maven"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        clientDevtest {
            client()
            sourceSet = sourceSets.devtest
            gameDirectory = project.file('run/devtest')
            systemProperty 'mest.devtest', 'true'
            systemProperty 'mest.devtest.quit', project.findProperty('mestDevtestQuit') ?: 'true'
            programArguments.addAll '--width', (project.findProperty('mestDevtestWidth') ?: '1600').toString(),
                    '--height', (project.findProperty('mestDevtestHeight') ?: '900').toString()
            // A folder with someone's layout.json/presets.json/preferences.json to start from (read only).
            if (project.findProperty('mestDevtestLayout')) {
                systemProperty 'mest.devtest.layout', project.findProperty('mestDevtestLayout').toString()
            }
            if (project.findProperty('mestDevtestGuiScale')) {
                systemProperty 'mest.devtest.guiScale', project.findProperty('mestDevtestGuiScale').toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.env.remapRefMap', 'true'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        mestdevtest {
            sourceSet(sourceSets.devtest)
        }
    }
}

mixin {
    add sourceSets.main, "mest.refmap.json"
    config "mest.mixins.json"
}

// See "Optional local GTL smoke test" below.
def gtlModsDir = providers.gradleProperty('mestGtlMods')

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    // Forge 1.20.1 does not ship MixinExtras; bundle it (initialised by MestMixinPlugin).
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1"))

    // AE2 + AE2WTLib (compile against the GTL versions, required at runtime).
    modCompileOnly "appeng:appliedenergistics2-forge:${ae2_version}"
    modCompileOnly "maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}"
    // AE2WTLib 15's config class extends cloth-config's ConfigData.
    modCompileOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"

    // Optional integrations.
    modCompileOnly "maven.modrinth:extended-ae:${extendedae_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_api_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_api_version}"
    modCompileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"

    // Development runtime: the AE2 part of the GTL stack.
    modRuntimeOnly "appeng:appliedenergistics2-forge:${ae2_version}"
    modRuntimeOnly "maven.modrinth:guideme:${guideme_version}"
    modRuntimeOnly "maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}"
    modRuntimeOnly "maven.modrinth:extended-ae:${extendedae_version}"
    modRuntimeOnly "maven.modrinth:glodium:${glodium_version}"
    modRuntimeOnly "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"
    modRuntimeOnly "dev.architectury:architectury-forge:${architectury_version}"
    if (!gtlModsDir.isPresent()) {
        // @jar: the Gradle metadata's runtime variant is the unshaded jar, which lacks JEI's
        // bundled search library; the plain artifact is the shaded release jar.
        // -PmestDevtestJei=<version> runs another JEI, e.g. 15.20.x as some GTL packs ship.
        modRuntimeOnly "mezz.jei:jei-${minecraft_version}-forge:${project.findProperty('mestDevtestJei') ?: jei_version}@jar"
    }
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    // Minecraft classes touched by tests (e.g. Mth) log through the SLF4J 2 API.
    testRuntimeOnly 'org.slf4j:slf4j-api:2.0.7'
}

// Optional local GTL smoke test: -PmestGtlMods=<GTL instance mods folder> puts gtlcore and its
// dependency chain on the development runtime (read-only; the jars are remapped into the Gradle
// cache). Without the property the dev runtime is just the AE2 stack above.
if (gtlModsDir.isPresent()) {
    def dir = file(gtlModsDir.get())
    // JEI is left out here: in a dev classpath gtceu's mixin plugin sees JEI and applies a JEI
    // mixin that its production class loading never applies, which fails against JEI 15.49.
    def wanted = ['gtlcore-', 'gtceu-', 'ldlib-forge-', 'ad_astra-forge-', 'botarium-forge-',
                  'resourcefulconfig-forge-', 'resourcefullib-forge-', 'gtmthings-', 'mae2-',
                  'ftb-ultimine-forge-', 'ftb-library-forge-', 'ftb-chunks-forge-', 'ftb-teams-forge-',
                  // Not a gtlcore dependency: checks the terminal drops its sort button.
                  'invtweaks-']
    repositories {
        exclusiveContent {
            forRepository {
                flatDir {
                    name = "GTL mods"
                    dirs dir
                }
            }
            filter {
                includeGroup "gtl.local"
            }
        }
    }
    dependencies {
        wanted.each { prefix ->
            def jar = dir.listFiles()?.find { it.name.contains(prefix) && it.name.endsWith('.jar') }
            if (jar == null) {
                throw new GradleException("mestGtlMods: no ${prefix}*.jar in ${dir}")
            }
            // flatDir resolves a version-less module straight to <name>.jar
            modRuntimeOnly(group: 'gtl.local', name: jar.name - '.jar')
        }
    }
}

// Unit tests are isolated from mod dependencies by default. Packet codec tests need the same
// Minecraft/Forge/AE2 API classes that compile the main source set.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Expand ${} properties in the mod metadata template.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_source_url         : mod_source_url,
            mod_issues_url         : mod_issues_url,
            mod_original_url       : mod_original_url,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    // The template carries Chinese author/description text.
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
    options.fork = true
    options.forkOptions.jvmArgs += ['-Duser.language=en', '-Duser.country=US']
}

// Forge 1.20.1 discovers mixin configs through this manifest attribute only.
tasks.named('jar', Jar).configure {
    manifest.attributes([
            'MixinConfigs': 'mest.mixins.json',
    ])
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
